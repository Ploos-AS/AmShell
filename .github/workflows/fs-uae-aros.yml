name: Amiga runtime provisional M1 qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aros-m1-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Gate 1 - host regression suite
        run: make check

      - name: Pull standard amiga-dev image
        env:
          AMIGA_DEV_IMAGE: ghcr.io/ploos-as/amiga-dev:edge
        run: docker pull "$AMIGA_DEV_IMAGE"

      - name: Gate 2 - build AmShell with amiga-dev
        env:
          AMIGA_DEV_IMAGE: ghcr.io/ploos-as/amiga-dev:edge
          AMIGA_CPU_PROFILE: "68000"
        run: |
          docker run --rm "$AMIGA_DEV_IMAGE" amiga-check
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e AMIGA_CPU_PROFILE="$AMIGA_CPU_PROFILE" \
            -v "$PWD:/workspace" \
            "$AMIGA_DEV_IMAGE" \
            amiga-build sh -lc 'make clean && make check && make'
          mkdir -p build/standard-infra
          printf '%s\n' 'builder=amiga-dev' 'image=ghcr.io/ploos-as/amiga-dev:edge' 'cpu=68000' 'qualification=Q1' > build/standard-infra/dev.txt

      - name: Build standard amiga-runtime image
        run: |
          git clone --depth 1 https://github.com/Ploos-AS/amiga-runtime.git "$RUNNER_TEMP/amiga-runtime"
          docker build -t ploos-amiga-runtime:ci "$RUNNER_TEMP/amiga-runtime"
          docker run --rm ploos-amiga-runtime:ci self-test
          mkdir -p build/standard-infra
          printf '%s\n' 'runtime=amiga-runtime' 'qualification=provisional-ci-only' > build/standard-infra/runtime.txt

      - name: Gate 3 - legacy AROS M1 harness (provisional)
        continue-on-error: true
        run: bash ci/fs-uae/run-aros-m1-after-startup.sh

      - name: Upload provisional qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amshell-fs-uae-aros-m1-provisional
          path: |
            build/standard-infra/**
            build/fs-uae/native/result.txt
            build/fs-uae/native/toolchain-image.txt
            build/fs-uae/native/file.txt
            build/fs-uae/native/sha256.txt
            build/fs-uae/aros-system/source.txt
            build/fs-uae/aros-system/archive.sha256
            build/fs-uae/aros-m1/result.txt
            build/fs-uae/aros-m1/fs-uae.log
            build/fs-uae/aros-m1/fs-uae-version.txt
            build/fs-uae/aros-m1/startup-sequence-patched.txt
            build/fs-uae/aros-m1/amshell-ci-sequence.txt
            build/fs-uae/aros-m1/amshell-ci-boot-*.txt
            build/fs-uae/aros-m1/amshell-ci-before-user-startup.txt
            build/fs-uae/aros-m1/amshell-ci-after-user-startup.txt
            build/fs-uae/aros-m1/amshell-ci-started.txt
            build/fs-uae/aros-m1/guest-console.txt
            build/fs-uae/aros-m1/guest-rc.txt
            build/fs-uae/aros-m1/guest-stage.txt
            build/fs-uae/aros-m1/m1-stage.txt
            build/fs-uae/aros-m1/m1.5-compare.txt
            build/fs-uae/aros-m1/m1.6-compare.txt
            build/fs-uae/aros-m1/m1.7-m1.9-compare.txt
            build/fs-uae/aros-m1/results/**
          if-no-files-found: warn
